apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kkium-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/team-KKIUM/KKIUM-BE
    targetRevision: infra/#13/github-actions-health-check
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: kkium
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true

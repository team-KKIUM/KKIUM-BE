apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kkium-app
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-deployed.discord: ""
    notifications.argoproj.io/subscribe.on-sync-failed.discord: ""
    notifications.argoproj.io/subscribe.on-health-degraded.discord: ""
spec:
  project: default
  source:
    repoURL: https://github.com/team-KKIUM/KKIUM-BE
    targetRevision: develop
    path: k8s/app
  destination:
    server: https://kubernetes.default.svc
    namespace: kkium
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true

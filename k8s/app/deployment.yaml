apiVersion: apps/v1
kind: Deployment
metadata:
  name: kkium-app
  namespace: kkium
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kkium-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: kkium-app
    spec:
      containers:
      - name: kkium-app
        image: asia-northeast3-docker.pkg.dev/kkium-prod/kkium-repo/kkium-app:8766ef2884abc8bc7abe66a44f7a86afb90a5bbc
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: kkium-secret
              key: DB_URL
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: kkium-secret
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kkium-secret
              key: DB_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: kkium-secret
              key: JWT_SECRET
        - name: JWT_ACCESS_TOKEN_EXPIRATION
          valueFrom:
            secretKeyRef:
              name: kkium-secret
              key: JWT_ACCESS_TOKEN_EXPIRATION
        - name: KAKAO_REST_API_KEY
          valueFrom:
            secretKeyRef:
              name: kkium-secret
              key: KAKAO_REST_API_KEY
        - name: KAKAO_REDIRECT_URI
          valueFrom:
            secretKeyRef:
              name: kkium-secret
              key: KAKAO_REDIRECT_URI
        - name: KAKAO_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: kkium-secret
              key: KAKAO_CLIENT_SECRET
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: kkium-secret
              key: GEMINI_API_KEY
        - name: NOTION_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: kkium-secret
              key: NOTION_CLIENT_ID
        - name: NOTION_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: kkium-secret
              key: NOTION_CLIENT_SECRET
        - name: NOTION_REDIRECT_URI
          valueFrom:
            secretKeyRef:
              name: kkium-secret
              key: NOTION_REDIRECT_URI
        - name: NOTION_FRONTEND_REDIRECT_URI
          valueFrom:
            secretKeyRef:
              name: kkium-secret
              key: NOTION_FRONTEND_REDIRECT_URI
        - name: AES_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: kkium-secret
              key: AES_SECRET_KEY
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: kkium-secret
              key: REDIS_HOST
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: kkium-secret
              key: OPENAI_API_KEY
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: kkium-secret
              key: GOOGLE_CLIENT_ID
        - name: GOOGLE_REDIRECT_URI
          valueFrom:
            secretKeyRef:
              name: kkium-secret
              key: GOOGLE_REDIRECT_URI
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: kkium-secret
              key: GOOGLE_CLIENT_SECRET
        - name: GOOGLE_CLOUD_VISION_API_KEY
          valueFrom:
            secretKeyRef:
              name: kkium-secret
              key: GOOGLE_CLOUD_VISION_API_KEY
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 180
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3

name: Build & Deploy

on:
  push:
    branches:
      - infra/#13/github-actions-health-check

env:
  PROJECT_ID: kkium-prod
  REGION: asia-northeast3
  REPO: kkium-repo
  IMAGE: kkium-app
  WORKLOAD_IDENTITY_PROVIDER: projects/341810655395/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  SERVICE_ACCOUNT: github-actions@kkium-prod.iam.gserviceaccount.com

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
    - name: 코드 체크아웃
      uses: actions/checkout@v4

    - name: JDK 21 설정
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Gradle 빌드 (테스트 제외)
      run: ./gradlew build -x test

    - name: GCP 인증 (Workload Identity Federation)
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ env.SERVICE_ACCOUNT }}

    - name: gcloud 설정
      uses: google-github-actions/setup-gcloud@v2

    - name: Docker 인증
      run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

    - name: 이미지 빌드 & 푸시
      run: |
        IMAGE_TAG=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}
        docker build -t $IMAGE_TAG:${{ github.sha }} -t $IMAGE_TAG:latest .
        docker push $IMAGE_TAG:${{ github.sha }}
        docker push $IMAGE_TAG:latest

    - name: k8s manifest 이미지 태그 업데이트
      run: |
        IMAGE_TAG=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}
        sed -i "s|image:.*kkium-app.*|image: $IMAGE_TAG:${{ github.sha }}|g" k8s/deployment.yaml

    - name: 변경된 manifest Git 커밋 & 푸시
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add k8s/deployment.yaml
        git commit -m "chore: update image tag to ${{ github.sha }}"
        git push

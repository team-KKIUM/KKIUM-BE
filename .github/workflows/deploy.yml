name: Build and Deploy

on:
  push:
    branches:
      - infra/#13/github-actions-health-check

env:
  PROJECT_ID: kkium-prod
  REGION: asia-northeast3
  REPO: kkium-repo
  IMAGE: kkium-app
  WORKLOAD_IDENTITY_PROVIDER: projects/341810655395/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  SERVICE_ACCOUNT: github-actions@kkium-prod.iam.gserviceaccount.com

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build with Gradle (skip tests)
      run: ./gradlew build -x test

    - name: Authenticate to GCP (Workload Identity Federation)
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ env.SERVICE_ACCOUNT }}

    - name: Set up gcloud
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

    - name: Build and Push Docker Image
      run: |
        IMAGE_TAG=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}
        docker build -t $IMAGE_TAG:${{ github.sha }} -t $IMAGE_TAG:latest .
        docker push $IMAGE_TAG:${{ github.sha }}
        docker push $IMAGE_TAG:latest

    - name: Update image tag in k8s manifest
      run: |
        IMAGE_TAG=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}
        sed -i "s|image:.*kkium-app.*|image: $IMAGE_TAG:${{ github.sha }}|g" k8s/deployment.yaml

    - name: Commit and push updated manifest
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add k8s/deployment.yaml
        git commit -m "chore: update image tag to ${{ github.sha }}"
        git push

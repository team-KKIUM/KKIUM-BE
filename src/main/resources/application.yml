spring:
  application:
    name: kkium
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379


  jwt:
    secret: ${JWT_SECRET}
    access:
      token:
        expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY}
  redirect-uri:
    prod: ${KAKAO_REDIRECT_URI_PROD:${KAKAO_REDIRECT_URI}}
    local: ${KAKAO_REDIRECT_URI_LOCAL:${KAKAO_REDIRECT_URI}}
  client-secret: ${KAKAO_CLIENT_SECRET}

google:
  client-id: ${GOOGLE_CLIENT_ID}
  redirect-uri:
    prod: ${GOOGLE_REDIRECT_URI_PROD:${GOOGLE_REDIRECT_URI}}
    local: ${GOOGLE_REDIRECT_URI_LOCAL:${GOOGLE_REDIRECT_URI}}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  cloud:
    vision:
      api-key: ${GOOGLE_CLOUD_VISION_API_KEY}

notion:
  client-id: ${NOTION_CLIENT_ID}
  client-secret: ${NOTION_CLIENT_SECRET}
  redirect-uri: ${NOTION_REDIRECT_URI}
  aes-secret-key: ${AES_SECRET_KEY}
  allowed-origins: ${NOTION_ALLOWED_ORIGINS:https://kkium.com,https://www.kkium.com,http://localhost:3000}

openai:
  api:
    key: ${OPENAI_API_KEY}

gemini:
  api-key: ${GEMINI_API_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: kkium
